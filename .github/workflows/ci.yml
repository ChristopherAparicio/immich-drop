name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Test application and public assets
        run: |
          python -m pytest -q
          python -m compileall -q app dropctl.py main.py
          node --check frontend/app.js
          python scripts/check-public-tree.py

      - name: Audit Python dependencies
        run: python -m pip_audit --requirement requirements.txt

      - name: Build hardened image
        run: docker build --pull --tag immich-drop:ci .

      - name: Verify image runtime contract
        run: |
          test "$(docker image inspect immich-drop:ci --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect immich-drop:ci --format '{{json .Config.ExposedPorts}}')" = '{"8080/tcp":{}}'
          test "$(docker image inspect immich-drop:ci --format '{{json .Config.Healthcheck.Test}}')" != 'null'

      - name: Exercise resumable upload in the hardened container
        env:
          IMMICH_DROP_TEST_IMAGE: immich-drop:ci
          PYTHON: python
        run: scripts/container-e2e.sh

      - name: Scan final image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: immich-drop:ci
          format: table
          exit-code: 1
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
